<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Sahayogi is a hybrid study assistant: Gemini Nano runs light prompts on-device and the same Firebase AI Logic SDK falls back to the cloud for heavy ones. Every answer states where it ran."
    />

    <!-- Social preview: judges and reviewers reach this link before the code. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahayogi" />
    <meta property="og:title" content="Sahayogi — a hybrid study assistant that says where every answer ran" />
    <meta
      property="og:description"
      content="Light prompts run on-device with Gemini Nano. Heavy ones use the cloud through Firebase AI Logic hybrid inference. Each answer is badged with the source the SDK reported, and the app records whether its own prediction was right."
    />
    <meta property="og:url" content="https://hackthon-dcdf7.web.app/" />
    <meta property="og:image" content="https://hackthon-dcdf7.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="The Sahayogi Ask page with a real cloud answer and its routing badge." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sahayogi — hybrid study assistant" />
    <meta
      name="twitter:description"
      content="Gemini Nano on-device, cloud fallback through one Firebase AI Logic SDK. Every answer states where it ran."
    />
    <meta name="twitter:image" content="https://hackthon-dcdf7.web.app/og-image.png" />

    <title>Sahayogi — hybrid study assistant</title>

  </head>
  <body>
    <script src="/boot-guard.js" defer></script>
    <div id="root">
      <!--
        Static skeleton, replaced the moment React mounts. On a 400 kbit/s connection the
        bundle takes several seconds to arrive; without this the browser paints an empty
        page and the app looks broken. Inline styles only — no second request to wait for.
      -->
      <div style="min-height:100vh;background:#0b0d10;color:#e7eaf0;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #222b36">
          <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6ea8ff,#3fb950);color:#0b0d10;font-weight:700;font-size:13px">S</span>
          <span style="font-size:14px;font-weight:600">Sahayogi</span>
          <span style="font-size:11px;color:#8b96a5">hybrid study assistant</span>
        </div>
        <div style="max-width:1024px;margin:0 auto;padding:32px 20px">
          <p id="boot-status" style="font-size:13px;color:#8b96a5">Loading…</p>
          <p style="font-size:12px;color:#5d6874;max-width:34rem;line-height:1.6">
            Light questions run on your device with Gemini Nano; heavy ones use the cloud. Every answer says which.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
