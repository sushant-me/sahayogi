name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The routing policy is pure, so the suite needs no Firebase project,
      # no browser and no secrets. That is deliberate.
      - run: npm test

      - run: npm run build
